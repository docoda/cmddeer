name: Bug report
description: Something does not work as expected.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time! If you opened this from CmdDeer, the first three fields are
        already filled in – please describe what happened below them. Please don't paste anything
        you typed while CmdDeer was running. Deutsch ist auch willkommen.

  - type: input
    id: version
    attributes:
      label: CmdDeer version
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: CmdDeer settings
      description: Filled in by CmdDeer. Contains no key presses or personal data.
      render: text
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you press, and what did CmdDeer (or Windows) do instead?
      placeholder: I pressed ⌘C in Outlook, but nothing was copied.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Press …
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: false

  - type: input
    id: app
    attributes:
      label: Affected app
      description: In which app did it happen (e.g. Chrome, Word, VS Code)?
    validations:
      required: false
